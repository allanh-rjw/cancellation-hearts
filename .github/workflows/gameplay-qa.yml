name: Gameplay QA

on:
  pull_request:
    paths:
      - app.js
      - gameplay-standard-fixes.js
      - gameplay-opponent-lookahead.js
      - gameplay-moon-fixes.js
      - gameplay-moon-calibration.js
      - gameplay-next-trick-flow.js
      - gameplay-rule-invariants.js
      - index.html
      - style.css
      - scripts/verify-rule-invariants.mjs
      - scripts/verify-standard-opponent-ai.mjs
      - scripts/diagnose-standard-opponent-ai.mjs
      - scripts/diagnose-opponent-lookahead.mjs
      - scripts/opponent-belief-state.mjs
      - scripts/verify-opponent-belief-state.mjs
      - scripts/verify-belief-aware-opponent.mjs
      - scripts/verify-opponent-lookahead.mjs
      - scripts/verify-gameplay-simulation.mjs
      - scripts/verify-gameplay-simulation-qa.mjs
      - scripts/verify-gameplay-simulation-fast-transitions.mjs
      - .github/workflows/gameplay-qa.yml
  workflow_dispatch:

jobs:
  gameplay-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check gameplay QA
        run: |
          node --input-type=module --check < gameplay-standard-fixes.js
          node --input-type=module --check < gameplay-opponent-lookahead.js
          node --input-type=module --check < gameplay-moon-fixes.js
          node --input-type=module --check < gameplay-moon-calibration.js
          node --input-type=module --check < gameplay-next-trick-flow.js
          node --input-type=module --check < gameplay-rule-invariants.js
          node --input-type=module --check < scripts/verify-standard-opponent-ai.mjs
          node --input-type=module --check < scripts/diagnose-standard-opponent-ai.mjs
          node --input-type=module --check < scripts/diagnose-opponent-lookahead.mjs
          node --input-type=module --check < scripts/opponent-belief-state.mjs
          node --input-type=module --check < scripts/verify-opponent-belief-state.mjs
          node --input-type=module --check < scripts/verify-belief-aware-opponent.mjs
          node --input-type=module --check < scripts/verify-opponent-lookahead.mjs
      # verify-rule-invariants.mjs runs in rule-invariants.yml, and
      # verify-gameplay-simulation-fast-transitions.mjs (the full-simulation
      # final gate) runs in adaptive-tutor-runtime.yml, which has no path
      # filter and always runs on every PR - running either here too only
      # duplicated the same check against the same inputs. See the app-layer
      # rebuild plan, Phase 5.
      - name: Verify standard opponent decisions
        run: node scripts/verify-standard-opponent-ai.mjs
      - name: Verify deterministic opponent diagnostic harness
        run: node scripts/diagnose-standard-opponent-ai.mjs --verify
      - name: Verify hidden-information opponent beliefs
        run: node scripts/verify-opponent-belief-state.mjs
      - name: Verify belief-aware opponent policy
        run: node scripts/verify-belief-aware-opponent.mjs
      - name: Verify multi-trick opponent lookahead
        run: node scripts/verify-opponent-lookahead.mjs
      - name: Compare Prompt 3 and Prompt 4 on paired deals
        run: node scripts/diagnose-opponent-lookahead.mjs
