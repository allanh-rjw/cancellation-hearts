name: ME20-SIM Closure Run

on:
  push:
    branches: [fix/me20-sim-diagnostic-scored-records]

permissions:
  contents: read

jobs:
  diagnose-preserve-listening:
    if: github.event.head_commit.message == 'Diagnose ME20-SIM preserve listening residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print deterministic preserve learner texts and evaluator results
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {SIMULATED_PERSONAS} from './simulation/personas.mjs';
          import {generateSimulatedResponse} from './simulation/generator.mjs';
          import {runBatch,loadTutorStack} from './simulation/harness.mjs';
          const batch=await runBatch({learners:12,seed:20260911,hands:1});
          const stack=await loadTutorStack();
          const problem=stack.adapter.problemForId('guided-queen-protection');
          const rows=[];
          for(let i=0;i<12;i++){
            const j=batch.journeys[i];
            if(j.placedLevel==='beginner')continue;
            const persona=SIMULATED_PERSONAS[i%SIMULATED_PERSONAS.length];
            const seed=20260911+i;
            const sim=generateSimulatedResponse({persona,problem,stepId:'preserve',seed:seed*1000+6,previousAnswers:{}});
            const evalResult=stack.adapter.evaluate({id:'preserve'},{text:sim.responseText,choice:sim.responseText},{exercise:problem},j.profile);
            rows.push({i,personaId:persona.learnerId,placedLevel:j.placedLevel,responseClass:sim.expectedResponseClass,complete:sim.complete,text:sim.responseText,evalResult});
          }
          console.log('PRESERVE_ROWS='+JSON.stringify(rows,null,2));
          console.log('LISTENING_FAILURES='+JSON.stringify(batch.failures.filter(f=>f.signature==='already-answered-question-repeated'),null,2));
          NODE
