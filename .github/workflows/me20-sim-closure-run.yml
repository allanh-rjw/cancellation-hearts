name: ME20-SIM Closure Run

on:
  push:
    branches:
      - fix/me20-sim-diagnostic-scored-records

permissions:
  contents: write

jobs:
  preserve-fix:
    if: github.event.head_commit.message == 'Run ME20 preserve fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preserve fix
        run: python3 scripts/me20-preserve-fix.py
      - name: Run small ME20-SIM gate
        run: node scripts/verify-tutor-simulation.mjs
      - name: Commit verified preserve fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutor-situational-coaching.js simulation/cases.mjs
          git commit -m "Accept natural card notation in preserve reasoning"
          git push origin HEAD:fix/me20-sim-diagnostic-scored-records
