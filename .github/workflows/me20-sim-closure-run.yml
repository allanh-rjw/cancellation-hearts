name: ME20-SIM Closure Run

on:
  push:
    branches:
      - fix/me20-sim-diagnostic-scored-records

permissions:
  contents: read

jobs:
  diagnose-preserve-patch:
    if: github.event.head_commit.message == 'Diagnose ME20 preserve patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proposed preserve patch
        run: python3 scripts/me20-preserve-fix.py
      - name: Print focused regression failures
        run: |
          node --input-type=module <<'NODE'
          import {runRegressionCorpus} from './simulation/harness.mjs';
          const report=await runRegressionCorpus({seed:20260911});
          console.log(JSON.stringify(report.evaluations.filter(e=>!e.passed),null,2));
          NODE
