name: ME20-SIM Closure Run

on:
  push:
    branches: [fix/me20-sim-diagnostic-scored-records]

permissions:
  contents: read

jobs:
  residual-diagnosis:
    if: github.event.head_commit.message == 'Diagnose ME20-SIM residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose placement and inference residuals
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {runBatch} from './simulation/harness.mjs';
          const batch=await runBatch({learners:100,seed:20260911,hands:2});
          const firstByPersona=new Map();
          for(const journey of batch.journeys){
            if(!firstByPersona.has(journey.personaId))firstByPersona.set(journey.personaId,journey);
          }
          const diagnosticSamples=[...firstByPersona.values()].map(j=>({
            personaId:j.personaId,
            trueLevel:j.trueLevel,
            placedLevel:j.placedLevel,
            total:j.diagnostic.placement.total,
            ratings:j.diagnostic.placement.ratings,
            handScores:j.diagnostic.placement.handScores
          }));
          const inferenceFailures=batch.journeys.flatMap(j=>(j.evaluations||[])
            .filter(e=>e.failures?.some(f=>f.dimension==='inference-discipline'))
            .map(e=>({
              personaId:j.personaId,
              trueLevel:j.trueLevel,
              caseId:e.caseId,
              stepId:e.stepId,
              responseClass:e.responseClass,
              move:e.move,
              coachText:e.text,
              failures:e.failures.filter(f=>f.dimension==='inference-discipline')
            })));
          const listeningFailures=batch.journeys.flatMap(j=>(j.evaluations||[])
            .filter(e=>e.failures?.some(f=>f.dimension==='listening'))
            .slice(0,2)
            .map(e=>({personaId:j.personaId,caseId:e.caseId,stepId:e.stepId,responseClass:e.responseClass,move:e.move,coachText:e.text})));
          const specificityFailures=batch.journeys.flatMap(j=>(j.evaluations||[])
            .filter(e=>e.failures?.some(f=>f.dimension==='specificity'))
            .slice(0,2)
            .map(e=>({personaId:j.personaId,caseId:e.caseId,stepId:e.stepId,responseClass:e.responseClass,move:e.move,coachText:e.text})));
          console.log('ME20_RESIDUAL_DIAG='+JSON.stringify({diagnosticSamples,inferenceFailures,listeningFailures,specificityFailures},null,2));
          NODE
