name: ME20-SIM Closure Run

on:
  push:
    branches:
      - fix/me20-sim-diagnostic-scored-records

permissions:
  contents: write

jobs:
  postpass-causal-fix:
    if: github.event.head_commit.message == 'Run ME20 post-pass causal verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply post-pass causal parser fix
        run: python3 scripts/me20-postpass-causal-fix.py
      - name: Run small ME20-SIM gate
        run: node scripts/verify-tutor-simulation.mjs
      - name: Commit verified parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hearts-passing-reasoning.js simulation/cases.mjs
          git commit -m "Recognize direct causal post-pass phrasing"
          git push origin HEAD:fix/me20-sim-diagnostic-scored-records
      - name: Run canonical 100-learner batch
        run: node simulation/cli.mjs --mode batch --learners 100 --hands 2 --seed 20260911 --write-report
      - name: Print canonical report
        run: cat simulation/results/latest.md
