name: ME20-SIM Closure Run

on:
  push:
    branches: [fix/me20-sim-diagnostic-scored-records]

permissions:
  contents: write

jobs:
  closure-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/me20-sim-diagnostic-scored-records
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix diagnostic scored-record flow and retire one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          harness = Path('simulation/harness.mjs')
          text = harness.read_text()
          old = "const responses=[],evidence=[],safeEvidence=[];let phaseSeed=seed;"
          new = "const responses=[],evidence=[],safeEvidence=[],scoredRecords=[];let phaseSeed=seed;"
          if old not in text:
              raise SystemExit('Expected diagnostic collection declaration not found')
          text = text.replace(old, new, 1)

          old = "evidence.push(recorded.evidence);safeEvidence.push(sanitizeSyntheticAssessmentEvidence(recorded.evidence));}\n const assessmentResult=s.assessment.result({session,evidence}),placement=s.diagnostic.scorePlacement(evidence,assessmentResult);"
          new = "evidence.push(recorded.evidence);safeEvidence.push(sanitizeSyntheticAssessmentEvidence(recorded.evidence));scoredRecords.push(recorded.scored);}\n const richScoredRecords=scoredRecords.filter(record=>Array.isArray(record?.normalizedResponse?.phaseScores)&&record.normalizedResponse.phaseScores.length>0);if(scoredRecords.length!==built.selection.selected.length||richScoredRecords.length!==scoredRecords.length)throw new Error('ME20-SIM diagnostic placement lost rich scored phase records');const assessmentResult=s.assessment.result({session,evidence}),placement=s.diagnostic.scorePlacement(evidence,assessmentResult,scoredRecords);"
          if old not in text:
              raise SystemExit('Expected diagnostic placement call not found')
          text = text.replace(old, new, 1)
          harness.write_text(text)

          workflow = Path('.github/workflows/adaptive-tutor-runtime.yml')
          wf = workflow.read_text()
          old = 'run: node --experimental-default-type=module scripts/verify-tutor-simulation.mjs'
          new = 'run: node scripts/verify-tutor-simulation.mjs'
          if old not in wf:
              raise SystemExit('Expected obsolete ME20-SIM invocation not found')
          workflow.write_text(wf.replace(old, new, 1))
          PY
          rm .github/workflows/me20-sim-closure-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/harness.mjs .github/workflows/adaptive-tutor-runtime.yml .github/workflows/me20-sim-closure-run.yml
          git commit -m "Fix ME20-SIM diagnostic scored-record flow"
          git push origin HEAD:fix/me20-sim-diagnostic-scored-records
      - name: Run small ME20-SIM gate
        run: node scripts/verify-tutor-simulation.mjs
      - name: Run canonical 100-learner ME20-SIM batch
        run: |
          node simulation/cli.mjs \
            --mode batch \
            --learners 100 \
            --hands 2 \
            --seed 20260911 \
            --write-report
      - name: Print canonical closure summary
        if: always()
        shell: bash
        run: |
          if [ -f simulation/results/latest.md ]; then
            echo '===== simulation/results/latest.md ====='
            cat simulation/results/latest.md
          fi
