name: Domain Pack Production Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-domain-pack-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production integration syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js causal-loader.js domain-pack-client.js game-state-adapter.js domain-pack-integration.js; do
            node --check "$file"
          done
      - name: Verify canonical game engine
        run: node scripts/verify-game-engine-conformance.mjs
      - name: Verify production Domain Pack boundary
        run: node scripts/verify-domain-pack-integration.mjs
      - name: Verify retired trainer is not production-reachable
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'hearts-tutor|adaptive-trainer/|causal/patch|eval\(' causal-loader.js
          grep -q '__legacyCancellationHeartsTrainerProductionEnabled=false' causal-loader.js
