name: Apply strategic coach deployment

on:
  push:
    branches: [main]
    paths:
      - 'deploy/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble strategic coach assets
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/READY
          cat deploy/app.part* | tr -d '\n\r ' | base64 -d | gunzip > app.js
          cat deploy/style.part* | tr -d '\n\r ' | base64 -d | gunzip > style.css
          rm -rf deploy
      - name: Commit deployed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css deploy
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy strategic coach build"
          git push
